[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0770
chown=root:sail

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:php]
; command=%(ENV_SUPERVISOR_PHP_COMMAND)s
command=/usr/bin/php -d variables_order=EGPCS /var/www/html/artisan serve --host=0.0.0.0 --port=80
; user=%(ENV_SUPERVISOR_PHP_USER)s
user=sail
environment=LARAVEL_SAIL="1",HOME="/home/sail"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true

[program:laravel-queue]
command=/usr/bin/php /var/www/html/artisan queue:work redis --queue=default --sleep=3 --tries=3 --max-time=3600
user=sail
environment=LARAVEL_SAIL="1",HOME="/home/sail"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
stopwaitsecs=3600

[program:laravel-scheduler]
command=/usr/bin/php /var/www/html/artisan schedule:work
user=sail
environment=LARAVEL_SAIL="1",HOME="/home/sail"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true

[program:vite]
command=node /var/www/html/node_modules/.bin/vite --host
user=sail
environment=LARAVEL_SAIL="1",HOME="/home/sail"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
